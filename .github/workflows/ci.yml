name: ci

on:
  push:
    branches: [main, "scout/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify patch banks in production Chromium
        run: |
          npm run preview:restart
          npm run test:browser
      - name: Save browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-bank-browser
          path: screenshots/patch-bank/
          if-no-files-found: ignore
          retention-days: 7
